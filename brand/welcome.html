<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сарафан · приветствие</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: var(--t); color: var(--ink);
    background:
      radial-gradient(80% 60% at 12% -10%, rgba(47, 123, 255, .22), transparent 62%),
      radial-gradient(60% 50% at 95% 0%, rgba(120, 190, 255, .26), transparent 60%),
      linear-gradient(180deg, #e8f1fa 0%, #f6fafd 45%, #ffffff 100%);
    display: grid; grid-template-columns: 1fr 560px; align-items: center; gap: 24px; padding: 0 64px 0 72px;
  }
  .logo { display: flex; align-items: center; gap: 14px; font: 800 38px/1 var(--t); letter-spacing: -.035em; }
  .logo svg { width: 46px; height: 46px; }
  h1 { font: 800 62px/1.05 var(--t); letter-spacing: -.035em; margin: 34px 0 0; max-width: 620px; }
  p { font-size: 25px; line-height: 1.4; color: var(--ink-2); margin: 22px 0 0; max-width: 580px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .chip { height: 44px; padding: 0 18px; border-radius: 999px; background: #fff; box-shadow: var(--sh-1);
          font: 600 18px/44px var(--t); color: var(--ink-2); }
  .chip.on { background: var(--grad-blue); color: #fff; box-shadow: var(--sh-blue); }

  /* круги знакомых */
  .orbit { position: relative; width: 430px; height: 430px; margin: 0 auto; }
  .ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; }
  .r1 { width: 56%; height: 56%; border: 2px solid rgba(47, 123, 255, .28); box-shadow: 0 0 40px rgba(47, 123, 255, .14); }
  .r2 { width: 94%; height: 94%; border: 2px dashed var(--line); }
  .core { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; text-align: center; }
  .core .me { width: 104px; height: 104px; border-radius: 50%; background: var(--grad-blue); color: #fff;
              display: grid; place-items: center; font: 800 37px/1 var(--t); box-shadow: 0 0 0 7px #fff, var(--sh-blue); }
  .core span { display: block; margin-top: 12px; font: 600 15px/1 var(--t); color: var(--ink-3); }
  .node { position: absolute; left: 50%; top: 50%; display: flex; flex-direction: column; align-items: center; gap: 7px;
          transform: rotate(var(--a)) translate(var(--r)) rotate(calc(-1 * var(--a))) translate(-50%, -50%); transform-origin: 0 0; }
  .face { width: 56px; height: 56px; border-radius: 50%; background: var(--mist); box-shadow: inset 0 0 0 2px var(--line);
          display: grid; place-items: center; color: var(--ink-4); }
  .face svg { width: 32px; height: 32px; }
  .node.near .face { box-shadow: 0 0 0 3px var(--blue), 0 0 0 7px rgba(47, 123, 255, .14); background: #eaf1ff; color: var(--blue); }
  .node i { font: 600 15px/1 var(--t); font-style: normal; color: var(--ink-2); background: #fff; padding: 6px 11px;
            border-radius: 999px; box-shadow: var(--sh-1); white-space: nowrap; }
</style>
</head>
<body>
  <div>
    <div class="logo">
      <svg viewBox="0 0 120 120" fill="none" stroke-linecap="round">
        <g stroke="var(--blue)" stroke-opacity=".5" stroke-width="7"><path d="M60 45 L60 31"/><path d="M47.6 68.5 L35.4 76.9"/><path d="M72.4 68.5 L84.6 76.9"/></g>
        <circle cx="60" cy="60" r="16" fill="var(--blue)"/>
        <g fill="none" stroke="var(--blue)" stroke-width="7"><circle cx="60" cy="22" r="9"/><circle cx="28" cy="82" r="9"/><circle cx="92" cy="82" r="9"/></g>
      </svg>
      сарафан
    </div>
    <h1>Люди, за которых ручаются ваши знакомые</h1>
    <p>Не рейтинг из интернета, а живая цепочка: видно, кто из ваших знакомых за человека отвечает.</p>
    <div class="chips">
      <span class="chip on">Юрист</span><span class="chip">Педиатр</span><span class="chip">Бухгалтер</span>
      <span class="chip">Репетитор</span><span class="chip">Психолог</span>
    </div>
  </div>

  <div class="orbit">
    <div class="ring r1"></div><div class="ring r2"></div>
    <div class="core"><div class="me">ВЫ</div><span>ваша сеть</span></div>
    <div class="node near" style="--a:-90deg;--r:120px"><div class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></div><i>Иван</i></div>
    <div class="node near" style="--a:30deg;--r:120px"><div class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></div><i>Мария</i></div>
    <div class="node near" style="--a:150deg;--r:120px"><div class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></div><i>Сергей</i></div>
    <div class="node" style="--a:-40deg;--r:196px"><div class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></div><i>Юрист</i></div>
    <div class="node" style="--a:80deg;--r:196px"><div class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></div><i>Педиатр</i></div>
    <div class="node" style="--a:200deg;--r:196px"><div class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></div><i>Бухгалтер</i></div>
  </div>
</body>
</html>
