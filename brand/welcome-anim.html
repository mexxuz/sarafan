<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сарафан · кадр ролика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  html, body { margin: 0; width: 640px; height: 360px; overflow: hidden; }
  body {
    font-family: var(--t); color: var(--ink);
    background:
      radial-gradient(70% 60% at 8% -12%, rgba(47, 123, 255, .26), transparent 60%),
      radial-gradient(60% 55% at 98% 0%, rgba(120, 190, 255, .3), transparent 58%),
      linear-gradient(180deg, #e8f1fa 0%, #f7fbfe 55%, #ffffff 100%);
    position: relative;
  }
  .logo { display: flex; align-items: center; gap: 9px; font: 800 24px/1 var(--t); letter-spacing: -.035em; }
  .logo svg { width: 30px; height: 30px; }
  h1 { font: 800 32px/1.08 var(--t); letter-spacing: -.035em; margin: 16px 0 0; max-width: 350px; }
  h1 b { color: var(--blue); font-weight: 800; }
  p { font: 600 17px/1.3 var(--t); color: var(--ink-2); margin: 12px 0 0; max-width: 340px; min-height: 44px; }
  .chips { display: flex; gap: 7px; margin-top: 14px; }
  .chip { height: 30px; padding: 0 12px; border-radius: 999px; background: #fff; box-shadow: var(--sh-1);
          font: 700 14px/30px var(--t); color: var(--ink-2); opacity: 0; transition: none; }
  .chip.on { background: var(--grad-blue); color: #fff; box-shadow: var(--sh-blue); }

  .left { position: absolute; left: 32px; top: 50%; transform: translateY(-50%); width: 348px; }
  .orbit { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); width: 190px; height: 190px; }
  .ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; opacity: 0; }
  .r1 { width: 60%; height: 60%; border: 2px solid rgba(47, 123, 255, .32); box-shadow: 0 0 24px rgba(47, 123, 255, .16); }
  .r2 { width: 100%; height: 100%; border: 2px dashed var(--line); }
  .me { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3;
        width: 58px; height: 58px; border-radius: 50%; background: var(--grad-blue); color: #fff;
        display: grid; place-items: center; font: 800 20px/1 var(--t); box-shadow: 0 0 0 5px #fff, var(--sh-blue); }
  .spin { position: absolute; inset: 0; }
  .node { position: absolute; left: 50%; top: 50%; display: flex; flex-direction: column; align-items: center; gap: 4px;
          transform: rotate(var(--a)) translate(var(--r)) rotate(calc(-1 * var(--a))) translate(-50%, -50%);
          transform-origin: 0 0; opacity: 0; z-index: 4; }
  .face { width: 38px; height: 38px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--blue), var(--sh-1);
          display: grid; place-items: center; color: var(--blue); }
  .node.far .face { box-shadow: inset 0 0 0 2px var(--line), var(--sh-1); color: var(--ink-4); background: var(--mist); width: 32px; height: 32px; }
  .face svg { width: 22px; height: 22px; }
  .node i { font: 700 13px/1 var(--t); font-style: normal; color: var(--ink); background: #fff; padding: 4px 8px;
            border-radius: 999px; box-shadow: var(--sh-1); white-space: nowrap; }
  .node.far i { color: var(--ink-3); font-weight: 600; }
</style>
</head>
<body>
  <div class="left">
    <div class="logo">
      <svg viewBox="0 0 120 120" fill="none" stroke-linecap="round">
        <g stroke="var(--blue)" stroke-opacity=".5" stroke-width="8"><path d="M60 45 L60 31"/><path d="M47.6 68.5 L35.4 76.9"/><path d="M72.4 68.5 L84.6 76.9"/></g>
        <circle cx="60" cy="60" r="17" fill="var(--blue)"/>
        <g fill="none" stroke="var(--blue)" stroke-width="8"><circle cx="60" cy="22" r="9"/><circle cx="28" cy="82" r="9"/><circle cx="92" cy="82" r="9"/></g>
      </svg>
      сарафан
    </div>
    <h1 id="head">Нужный человек —<br><b>через знакомых</b></h1>
    <p id="sub">Видно, кто за него ручается</p>
    <div class="chips">
      <span class="chip on">Юрист</span><span class="chip">Врач</span><span class="chip">Репетитор</span>
    </div>
  </div>

  <div class="orbit">
    <div class="ring r1"></div><div class="ring r2"></div>
    <div class="me">ВЫ</div>
    <div class="spin" id="spin">
      <div class="node near" style="--a:-80deg;--r:64px"><div class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></div><i>Иван</i></div>
      <div class="node near" style="--a:80deg;--r:64px"><div class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></div><i>Мария</i></div>
      <div class="node far" style="--a:-155deg;--r:84px"><div class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></div><i>Юрист</i></div>
      <div class="node far" style="--a:155deg;--r:84px"><div class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></div><i>Врач</i></div>
    </div>
  </div>

<script>
// Один кадр ролика: ?f=<номер>&n=<всего>. Всё считается, ничего не анимируется само —
// так каждый кадр получается одинаковым при любой скорости отрисовки.
(function () {
  const q = new URLSearchParams(location.search);
  const n = +q.get('n') || 36;
  const f = (+q.get('f') || 0) % n;
  const t = f / n;                         // 0…1 по кругу
  const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);

  // круги и нити проявляются в начале, дальше просто плывут
  const r1 = document.querySelector('.r1'), r2 = document.querySelector('.r2');
  r1.style.opacity = ease(t / 0.12);
  r2.style.opacity = ease((t - 0.22) / 0.14);

  document.querySelectorAll('.node').forEach((el) => {
    el.style.setProperty('--a', (parseFloat(el.style.getPropertyValue('--a')) - t * 180) + 'deg');
  });

  // ближний круг — на второй восьмой, дальний — на четвёртой
  const near = [...document.querySelectorAll('.node.near')];
  near.forEach((el, i) => { el.style.opacity = ease((t - 0.10 - i * 0.05) / 0.12); });
  const far = [...document.querySelectorAll('.node.far')];
  far.forEach((el, i) => { el.style.opacity = ease((t - 0.30 - i * 0.05) / 0.14) * 0.96; });

  // подписи слева появляются следом
  document.querySelectorAll('.chip').forEach((el, i) => { el.style.opacity = ease((t - 0.45 - i * 0.05) / 0.12); });
  document.getElementById('sub').style.opacity = ease((t - 0.38) / 0.14);
})();
</script>
</body>
</html>
